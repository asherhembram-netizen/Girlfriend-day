<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Girlfriend's Day ❤️</title>

<style>
body{
margin:0;
font-family:Poppins,sans-serif;
background:#fff7fc;
text-align:center;
color:#5a3d5c;
}

.container{
padding:25px;
max-width:420px;
margin:auto;
}

.badge{
display:inline-block;
padding:10px 20px;
border-radius:30px;
background:white;
box-shadow:0 4px 15px rgba(0,0,0,.08);
font-weight:bold;
color:#d15fa5;
}

.avatar{
margin:25px auto;
width:120px;
height:120px;
border-radius:50%;
border:6px solid #e8d8ff;
overflow:hidden;
}

.avatar img{
width:100%;
height:100%;
object-fit:cover;
}

h1{
font-size:38px;
margin:10px 0;
}

.sub{
font-size:22px;
color:#b26be0;
}

p{
line-height:1.8;
font-size:17px;
padding:10px;
}

.btn{
margin-top:20px;
padding:14px 28px;
background:#c68cff;
color:white;
border:none;
border-radius:30px;
font-size:18px;
}

.footer{
margin-top:40px;
font-size:15px;
color:#999;
}
</style>

</head>

<body>

<div class="container">

<div class="badge">
💗 FOR MY FAVOURITE PERSON
</div>

<div class="avatar">
<img src="your-photo.jpg">
</div>

<h1>Happy Girlfriend's Day 💕</h1>

<div class="sub">
for you, always ♡
</div>

<p>
Every day with you feels special.
Thank you for making my life brighter,
my heart happier and my smile bigger.
I love you endlessly ❤️
</p>

<button class="btn">
Forever & Always 🌸
</button>

<div class="footer">
Made with ❤️ just for you
</div>

</div>

</body>
  </html>
